<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" stroke="#312e81" stroke-width="6" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="170" fill="url(#glow)" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#818cf8" stroke-width="4" opacity="0.6" />
  <circle cx="256" cy="256" r="60" fill="#1e1b4b" stroke="url(#accent)" stroke-width="6" />

  <!-- Crosshair Axis -->
  <line x1="256" y1="56" x2="256" y2="150" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="362" x2="256" y2="456" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" />
  <line x1="56" y1="256" x2="150" y2="256" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" />
  <line x1="362" y1="256" x2="456" y2="256" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" />

  <!-- Center Target Core -->
  <circle cx="256" cy="256" r="22" fill="#10b981" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" />

  <!-- Target Lead Blips -->
  <circle cx="340" cy="180" r="14" fill="#38bdf8" />
  <circle cx="170" cy="330" r="10" fill="#a855f7" />
  <circle cx="350" cy="320" r="8" fill="#10b981" />

  <!-- Lead AI Sparkle -->
  <path d="M 340 160 Q 340 180 320 180 Q 340 180 340 200 Q 340 180 360 180 Q 340 180 340 160 Z" fill="#ffffff" opacity="0.9" />
</svg>
